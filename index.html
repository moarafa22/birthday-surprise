<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>بحبك يا توتي 🎂</title>
    
    <!-- ===== الخطوط العربية العصرية ===== -->
    <!-- Alexandria: أنيق وعصري - مناسب للعناوين الكبيرة -->
    <!-- El Messiri: راقي وجميل - مناسب للأسماء والكلمات المميزة -->
    <!-- Reem Kufi: واضح وعصري - مناسب للنصوص الطويلة -->
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=El+Messiri:wght@400;500;600;700&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- ===== الخطوط الإنجليزية ===== -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    
    <style>
        /* تحسينات عامة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #0d0b0c;
            font-family: 'Alexandria', 'Reem Kufi', 'Inter', system-ui, sans-serif;
            color: #f2ece6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* تحسين القراءة للغة العربية */
        * {
            font-feature-settings: "ss01" on, "ss02" on;
        }
        
        /* إخفاء شريط التمرير */
        ::-webkit-scrollbar {
            display: none;
        }
        body {
            scrollbar-width: none;
        }
        
        /* Glassmorphism */
        .glass {
            backdrop-filter: blur(12px) saturate(1.2);
            -webkit-backdrop-filter: blur(12px) saturate(1.2);
            background: rgba(255, 245, 240, 0.06);
            border: 0.5px solid rgba(255, 245, 240, 0.08);
            box-shadow: 0 16px 48px rgba(0,0,0,0.4);
        }
        
        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        /* تحسينات للأزرار */
        button {
            font-family: 'Alexandria', 'Reem Kufi', sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        /* تحسينات للصور */
        img {
            -webkit-user-drag: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
